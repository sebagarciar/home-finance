[project]
name = "home-finance-backend"
version = "0.1.0"
description = "Household finance app backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
    "rapidfuzz>=3.10",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, comprehensions.
select = ["F", "E", "W", "I", "B", "UP", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI's Depends()/Query()/File() in defaults is the intended pattern
    "UP042", # (str, Enum) is intentional for Pydantic/JSON serialization — not StrEnum
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true   # yfinance / openpyxl / xlrd ship no stubs
check_untyped_defs = true
warn_unused_ignores = true
# Pragmatic baseline — tighten incrementally rather than gate everything now.
disallow_untyped_defs = false
exclude = ["alembic/", "tests/"]
